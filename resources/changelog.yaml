# Newest release first. tag is one of: added, improved, fixed.
# `major: true` marks a headline change: the "What's new" popup that greets
# everyone after an update lists exactly those, and sends the rest to this
# screen behind Read more. Most releases have one or two; a release with none
# shows no popup at all. Keep the major entries at the top of the release.
# text_ms is optional — falls back to `text` when omitted.
# A \n inside a double-quoted text renders as a line break (the screen sets
# white-space: pre-line). Keep text and text_ms broken at the same places.
# link/link_text/link_text_ms are optional too: they render a button beside the
# entry, for a release note that names a screen worth opening.
#
# Version is semver MAJOR.MINOR, not CalVer, and tracks what actually lands on
# gitlab main (prod) — not dev commits. Baseline 1.0 is the 2026-08-02 gitlab
# main launch commit. Bump MINOR for an ordinary release; bump MAJOR only for
# something meaningful (a real breaking or headline change), never on a fixed
# cadence. A PATCH digit (MAJOR.MINOR.PATCH) is allowed for a same-day
# follow-on that finishes what the MINOR release started, rather than opening
# a new line of work — e.g. 1.7.1 after 1.7, not a fresh 1.8.

- version: "1.7.1"
  date: "2026-09-01"
  entries:
    - tag: added
      text: "The sidebar now puts a red dot on anything waiting for you, so you can see it without opening every screen. Leave, Claims and Overtime dot when a request needs your verification or your approval. T.A.A. dots when somebody else has put a card on your board and it is still sitting in To Do. Helpdesk dots when a ticket has been handed to you and nobody has started it. Events dots when an event tags your name and you have not said whether you are going. TOT Sessions dots when your own slot is a fortnight away or nearer. Knowledge Bank dots in the last week of the month if you still have not logged a lesson.\nEvery dot clears itself the moment you deal with the thing behind it — pick the card up, start the ticket, RSVP, log the lesson. A closed section keeps its own dot, so nothing hides behind a collapsed group."
      text_ms: "Bar sisi kini meletakkan titik merah pada apa-apa yang menunggu anda, jadi anda boleh nampak tanpa membuka setiap skrin. Cuti, Tuntutan dan Kerja Lebih Masa bertitik apabila ada permohonan yang perlu pengesahan atau kelulusan anda. T.A.A. bertitik apabila orang lain meletakkan kad pada papan anda dan ia masih berada dalam To Do. Helpdesk bertitik apabila tiket diserahkan kepada anda dan belum disentuh sesiapa. Acara bertitik apabila sesuatu acara menandakan nama anda dan anda belum menjawab sama ada anda hadir. Sesi TOT bertitik apabila slot anda sendiri tinggal dua minggu atau kurang. Bank Pengetahuan bertitik pada minggu terakhir bulan jika anda masih belum merekod pelajaran.\nSetiap titik hilang sendiri sebaik sahaja anda uruskan perkara di sebaliknya — ambil kad itu, mulakan tiket, jawab RSVP, rekod pelajaran. Bahagian yang ditutup mengekalkan titiknya sendiri, jadi tiada apa yang tersembunyi di sebalik kumpulan yang dilipat."
    - tag: improved
      text: "Applying for leave now asks for a reason, and it is no longer optional — your manager reads it before deciding, and a blank one only sent the request back to you anyway.\nVerifiers get a comment box of their own. Whatever the manager writes when they verify is shown to the director who gives final approval, so the second person is not deciding blind.\nBoth the verifier and the approver now see the leave type spelled out on the request, in colour, instead of having to open it to find out whether it was annual, medical or unpaid.\nA supporting document opens in a new tab for you to look at, instead of downloading to your machine the moment you click it."
      text_ms: "Memohon cuti kini meminta sebab, dan ia tidak lagi pilihan — pengurus anda membacanya sebelum membuat keputusan, dan yang kosong hanya akan dihantar semula kepada anda.\nPengesah pula mendapat kotak komen sendiri. Apa sahaja yang ditulis pengurus semasa mengesahkan akan dipaparkan kepada pengarah yang memberi kelulusan akhir, jadi orang kedua tidak membuat keputusan secara buta.\nPengesah dan pelulus kini melihat jenis cuti tertera jelas pada permohonan, berwarna, tanpa perlu membukanya untuk tahu sama ada ia cuti tahunan, cuti sakit atau cuti tanpa gaji.\nDokumen sokongan kini dibuka dalam tab baharu untuk anda lihat, bukan terus dimuat turun ke komputer anda sebaik diklik."
      link: "/app/leave"
      link_text: "Open Leave"
      link_text_ms: "Buka Cuti"
    - tag: added
      text: "HR can now say which leave types apply to which person. On Leave Setup, every person has a tick box beside each type — untick it and that type stops being offered to them altogether, so an intern is simply not shown annual leave. Everybody currently keeps every type, so nothing changes until HR unticks something.\nLeave Setup is also four tabs now — Types, Holidays, Balances and Replacement — rather than one long scroll."
      text_ms: "HR kini boleh menetapkan jenis cuti mana yang terpakai untuk siapa. Pada Persediaan Cuti, setiap orang mempunyai kotak tanda di sebelah setiap jenis — buang tandanya dan jenis itu tidak lagi ditawarkan kepada mereka langsung, jadi pelatih memang tidak dipaparkan cuti tahunan. Buat masa ini semua orang mengekalkan semua jenis, jadi tiada apa berubah sehingga HR membuang mana-mana tanda.\nPersediaan Cuti kini juga terbahagi kepada empat tab — Jenis, Cuti Umum, Baki dan Ganti — bukan satu skrin panjang."
    - tag: improved
      text: "Asking Claude to put a task on somebody's board now works by name. Say \"assign this to Nabil\" and it finds the person, instead of stopping to ask you for a staff number that nothing in the app ever shows you. Nicknames work too, since that is what people actually go by.\nIf the name fits more than one person it says so and lists them, rather than picking one — a task landing on the wrong board emails the wrong person.\nAdding somebody to an existing card works the same way now: \"put Nabil on this card\" is enough."
      text_ms: "Meminta Claude meletakkan tugasan pada papan seseorang kini boleh dibuat dengan nama. Sebut \"berikan ini kepada Nabil\" dan ia akan mencari orangnya, bukan berhenti untuk meminta anda nombor kakitangan yang memang tidak dipaparkan di mana-mana dalam app. Nama panggilan pun boleh, kerana itulah yang orang gunakan.\nJika nama itu sepadan dengan lebih daripada seorang, ia akan memberitahu dan menyenaraikan mereka, bukan memilih sendiri — tugasan yang jatuh pada papan yang salah menghantar e-mel kepada orang yang salah.\nMenambah seseorang pada kad yang sedia ada kini sama caranya: \"letak Nabil pada kad ini\" sudah memadai."
      link: "/docs/mcp"
      link_text: "Read the guide"
      link_text_ms: "Baca panduan"
    - tag: fixed
      text: "The notification bell and message badge no longer crash the header when the app briefly loses its database connection. They now just quietly wait for the next check instead of showing a broken screen."
      text_ms: "Loceng pemberitahuan dan lencana mesej tidak lagi merosakkan bahagian atas apabila aplikasi hilang sambungan pangkalan data seketika. Ia kini hanya menunggu semakan seterusnya secara senyap dan bukan memaparkan skrin rosak."

- version: "1.7"
  date: "2026-09-01"
  entries:
    - tag: added
      major: true
      text: "Your timesheet now fills itself in from the T.A.A. board, and the Add button is gone. Every card you had in In Progress or In Review shows up on the days you worked it, already carrying its category and project — all you set is how much of the day it took. Did something you were not actually on? Remove the line and it stays removed. A mis-tap is one click back, from the \"Removed\" line under the day. Work that is not on the board never reaches your timesheet, so put it on the board first.\nA card now says what category it is. Category and Project sit side by side on the card, and the Projects screen stays the place that decides which categories a project falls under. Book a card to a project tagged one way and the card just says so, with nothing to pick. Book it to a project tagged several ways and you choose, but only from that project's own list. A card with no project behind it picks from everything, which is how meetings, admin and the rest reach your timesheet at all."
      text_ms: "Lembaran masa anda kini mengisi dirinya sendiri daripada papan T.A.A., dan butang Tambah telah dibuang. Setiap kad anda yang berada dalam In Progress atau In Review akan muncul pada hari-hari anda mengusahakannya, lengkap dengan kategori dan projeknya — anda hanya menetapkan berapa banyak hari itu digunakan. Ada baris yang anda tidak kerjakan? Buang ia dan ia kekal dibuang. Tersalah tekan pula satu klik untuk kembali, melalui baris \"Dibuang\" di bawah hari itu. Kerja yang tiada di papan tidak akan sampai ke lembaran masa, jadi letakkannya di papan dahulu.\nSesebuah kad kini menyatakan kategorinya. Kategori dan Projek duduk bersebelahan pada kad, dan skrin Projek kekal sebagai tempat yang menentukan kategori bagi sesuatu projek. Kad yang diletakkan pada projek dengan satu kategori terus menyatakannya, tiada apa untuk dipilih. Kad pada projek dengan beberapa kategori pula anda yang pilih, tetapi hanya daripada senarai projek itu sendiri. Kad tanpa projek boleh memilih daripada semua, itulah caranya mesyuarat, kerja pentadbiran dan selebihnya sampai ke lembaran masa anda."
      link: "/app/timesheets"
      link_text: "Open Timesheet"
      link_text_ms: "Buka Lembaran Masa"
    - tag: improved
      major: true
      text: "External training and workshops have moved from the T.O.T. screen to Events, so everything with a date on it lives in one place. The invites already posted came along, links and tagged names intact.\nPost one with the \"+ New event\" button and tick \"External — hosted outside the company\": you get the organiser's name, a map link, a sign-up link, and the same @mention that tells someone they are expected to register. Leave it unticked for an ordinary company event with RSVP. Paste a forwarded invite into the box at the top and it fills in the date, time and venue for you.\nAn external event shows a Register button instead of Going / Maybe / Can't go — you sign up on the organiser's own form, which the app has no way of tracking.\nManagers can post events now, not just HR, because a manager is usually the one an invite gets forwarded to.\nPast events are open to everyone rather than HR only. The last month is listed as usual and anything older sits behind \"Older events\", one click away. A past event still shows its description and can still be corrected — a wrong date or a dead link is exactly the thing you find out about afterwards."
      text_ms: "Latihan dan bengkel luaran telah berpindah dari skrin T.O.T. ke Acara, jadi segala yang bertarikh berada di satu tempat. Jemputan yang sudah disiarkan turut dibawa bersama, lengkap dengan pautan dan nama yang ditag.\nSiarkan satu dengan butang \"+ New event\" dan tandakan \"Luaran — dianjurkan di luar syarikat\": anda dapat nama penganjur, pautan peta, pautan pendaftaran, dan @mention yang sama untuk memberitahu seseorang bahawa mereka dijangka mendaftar. Biarkan tanpa tanda untuk acara syarikat biasa dengan RSVP. Tampal jemputan yang diteruskan ke dalam kotak di bahagian atas dan ia akan mengisi tarikh, masa dan tempat untuk anda.\nAcara luaran memaparkan butang Daftar dan bukan Hadir / Mungkin / Tak dapat — anda mendaftar pada borang penganjur sendiri, yang tidak dapat dijejaki oleh aplikasi.\nPengurus kini boleh menyiarkan acara, bukan HR sahaja, kerana pengurus selalunya orang yang menerima jemputan yang diteruskan.\nAcara lepas kini terbuka kepada semua orang, bukan HR sahaja. Sebulan yang lepas disenaraikan seperti biasa dan apa-apa yang lebih lama berada di bawah \"Acara lama\", satu klik sahaja. Acara lepas masih memaparkan penerangannya dan masih boleh dibetulkan — tarikh yang salah atau pautan yang mati memang perkara yang anda sedari kemudian."
      link: "/app/events"
      link_text: "Open Events"
      link_text_ms: "Buka Acara"
    - tag: added
      major: true
      text: "You can now connect Claude on your own computer to AmanahKu and ask it about your work — \"what did I log on my timesheet last week?\", \"what's on my board?\", \"when's the next TOT session?\" — instead of clicking through screens to find out. Get your own key from Account & security; it only ever shows you what you can already see in the app, so a normal staff member sees their own records, and HR and management see the company, exactly as on screen.\nOptionally, let it make changes too — create and edit board cards, save a timesheet draft, and more. Ask it to draft your timesheet and it works from your board cards, the same ones your timesheet screen already suggests, so it never invents a category or a project — it reads them off the card. Turn this on with a checkbox next to your key, and every change always shows you exactly what it's about to do first and waits for your yes before anything happens."
      text_ms: "Anda kini boleh menyambungkan Claude pada komputer anda sendiri ke AmanahKu dan bertanya tentang kerja anda — \"apa yang saya log pada lembaran masa minggu lepas?\", \"apa yang ada pada board saya?\", \"bila sesi TOT seterusnya?\" — tanpa perlu mengklik melalui skrin untuk mengetahuinya. Dapatkan kunci anda sendiri daripada Akaun & keselamatan; ia hanya memaparkan apa yang anda sendiri sudah boleh lihat dalam app, jadi kakitangan biasa melihat rekod sendiri, manakala HR dan pengurusan melihat syarikat, sama seperti pada skrin.\nSecara pilihan, benarkan ia membuat perubahan juga — cipta dan edit kad board, simpan draf lembaran masa, dan lain-lain. Minta ia merangka lembaran masa anda dan ia akan bekerja daripada kad board anda, sama seperti yang dicadangkan oleh skrin lembaran masa anda, jadi ia tidak sesekali mereka-reka kategori atau projek — ia membacanya terus daripada kad. Hidupkan ini dengan kotak semak di sebelah kunci anda, dan setiap perubahan sentiasa menunjukkan tepat apa yang akan dilakukan dahulu serta menunggu jawapan ya anda sebelum apa-apa berlaku."
      link: "/docs/mcp"
      link_text: "Read the guide"
      link_text_ms: "Baca panduan"
    - tag: added
      major: true
      text: "Work items with a due date can now put themselves on your Google Calendar. Connect your Google account from the Work & Tasks tab on your profile, and any task assigned to you — or its due date changing — shows up as an all-day event automatically. Unassigned from it, marked done, or the due date cleared, and the event goes away too. It only ever writes to your calendar, so anything you do inside Google Calendar itself stays untouched."
      text_ms: "Item kerja yang mempunyai tarikh akhir kini boleh memaparkan diri pada Kalendar Google anda. Sambungkan akaun Google anda dari tab Kerja & Tugas pada profil anda, dan sebarang tugas yang ditugaskan kepada anda — atau tarikh akhirnya berubah — akan muncul secara automatik sebagai acara sepanjang hari. Apabila ditugaskan semula kepada orang lain, ditanda selesai, atau tarikh akhir dikosongkan, acara itu turut hilang. Ia hanya menulis ke kalendar anda, jadi apa sahaja yang anda buat dalam Kalendar Google sendiri kekal tidak tersentuh."
      link: "/app/profile"
      link_text: "Open your profile"
      link_text_ms: "Buka profil anda"
    - tag: improved
      text: "Editing a line asks the three things a card cannot answer for you: what you were doing (Management, Meeting, Technical and the rest, one tap), how much of the day it took, and any notes. Category and project sit at the top for you to see, not to pick — they belong to the card.\nThe timesheet category list is down to five: Development, Maintenance, InHouse Project, Sales, and Others for everything that is not billed to a project. The rest are switched off rather than deleted, so old weeks still read exactly as they were filed. On Leave and Medical Leave are gone from the list too — approved leave already fills those days in for you, and picking it by hand only ever made a second, less reliable copy."
      text_ms: "Menyunting satu baris kini bertanya tiga perkara yang tidak boleh dijawab oleh kad: anda buat apa (Management, Meeting, Technical dan selebihnya, satu ketukan), berapa banyak hari itu digunakan, dan sebarang nota. Kategori dan projek dipaparkan di bahagian atas untuk dilihat, bukan dipilih — ia milik kad itu.\nSenarai kategori lembaran masa kini tinggal lima: Development, Maintenance, InHouse Project, Sales, dan Others untuk segala yang tidak dicaj kepada projek. Selebihnya dimatikan, bukan dipadam, jadi minggu lama masih terbaca tepat seperti asal difailkan. On Leave dan Medical Leave juga dibuang daripada senarai — cuti yang diluluskan sudah pun mengisi hari-hari itu untuk anda, dan memilihnya sendiri hanya menghasilkan salinan kedua yang kurang tepat."
    - tag: fixed
      text: "Applying leave over the first Saturday of the month now costs half a day, not a whole day — that Saturday is already a half working day (TOT) everywhere else in the app, and leave now matches."
      text_ms: "Memohon cuti pada Sabtu pertama bulan itu kini mengambil separuh hari, bukan sehari penuh — Sabtu itu sudah pun separuh hari bekerja (TOT) di tempat lain dalam aplikasi, dan cuti kini turut sama."

- version: "1.6"
  date: "2026-08-26"
  entries:
    - tag: added
      text: "Forgot to clock out? At the end of the night the app now closes the day for you, at your shift end time. You get a bell telling you it happened, and the day is marked as closed by the app rather than punched by you, so HR can see it and type in a truer time if you were still working. Before this, a day left open never counted at all."
      text_ms: "Terlupa clock out? Pada hujung malam, aplikasi kini menutup hari itu untuk anda, pada waktu tamat syif anda. Anda akan menerima loceng memberitahu ia berlaku, dan hari itu ditanda sebagai ditutup oleh aplikasi, bukan direkod oleh anda, jadi HR boleh melihatnya dan menaip masa yang lebih tepat jika anda masih bekerja. Sebelum ini, hari yang dibiarkan terbuka langsung tidak dikira."
      link: "/app/attendance"
      link_text: "Open Attendance"
      link_text_ms: "Buka Kehadiran"
    - tag: fixed
      text: "Working past midnight no longer shows up as \"Left early\". Clocking out after 12am was being compared against the next day's finishing time, so a long night was marked as leaving early and asked you for a reason. Days already marked this way keep the label until HR clears them."
      text_ms: "Bekerja melepasi tengah malam tidak lagi dipaparkan sebagai \"Balik awal\". Clock out selepas 12 pagi dibandingkan dengan waktu tamat hari berikutnya, jadi malam yang panjang ditanda sebagai balik awal dan meminta sebab daripada anda. Hari yang sudah ditanda begitu akan kekal sehingga HR membetulkannya."

- version: "1.5"
  date: "2026-08-21"
  entries:
    - tag: improved
      text: "The Attendance Report has been rebuilt as a ledger: one line per person per day, so a whole team's week reads top to bottom without opening anything. Pick a day, a week, a month, or set your own dates. The counts at the top — days clocked, hours, late, and days needing a fix — follow whatever department or name you filter by.\nChanging a filter or opening someone no longer rebuilds the whole page. Only the part that changed is fetched, so the report keeps up even with several hundred rows on screen."
      text_ms: "Laporan Kehadiran telah dibina semula sebagai lejar: satu baris bagi setiap orang bagi setiap hari, jadi seminggu penuh satu pasukan boleh dibaca dari atas ke bawah tanpa membuka apa-apa. Pilih hari, minggu, bulan, atau tetapkan tarikh anda sendiri. Kiraan di bahagian atas — hari direkod, jam, lewat, dan hari yang perlu dibetulkan — mengikut jabatan atau nama yang anda tapis.\nMenukar tapisan atau membuka seseorang tidak lagi membina semula keseluruhan halaman. Hanya bahagian yang berubah diambil, jadi laporan kekal pantas walaupun beratus baris dipaparkan."
      link: "/app/attendance-report"
      link_text: "Open the Attendance Report"
      link_text_ms: "Buka Laporan Kehadiran"
    - tag: added
      text: "The buttons above the table — late, missing clock out, off site, and the rest — narrow the list to just those days without moving the totals. The totals answer \"how did the team do\", the buttons answer \"show me the ones I need to look at\", and the two no longer fight each other.\nClick anyone on the report to open their own panel: every day in the period, the selfie taken at the punch, whatever reason they typed, and the map point. Everything you need to decide sits in one place instead of being spread across the row.\nHR can now type in a missing clock out straight from that panel, instead of the day sitting broken until someone edits the record by hand. A time added this way is marked as typed in, not punched, so the record still says what really happened.\nAn off site punch now shows the map with its exact latitude and longitude underneath, and how far it was from the office it should have been at. A number to check, not just a pin to squint at.\nDownload the report as a spreadsheet, exactly as it appears on screen — same period, same filters, same rows."
      text_ms: "Butang di atas jadual — lewat, tiada clock out, di luar lokasi, dan selebihnya — menyempitkan senarai kepada hari-hari itu sahaja tanpa mengubah jumlah keseluruhan. Jumlah menjawab \"bagaimana prestasi pasukan\", butang pula menjawab \"tunjukkan yang saya perlu lihat\", dan kedua-duanya tidak lagi bertindih.\nKlik sesiapa sahaja dalam laporan untuk membuka panel mereka sendiri: setiap hari dalam tempoh itu, selfie yang diambil semasa merekod, sebarang sebab yang ditaip, dan titik peta. Segala yang anda perlukan untuk membuat keputusan berada di satu tempat, bukan bertaburan pada baris.\nHR kini boleh menaip clock out yang tertinggal terus dari panel itu, tanpa perlu membiarkan hari itu rosak sehingga seseorang menyunting rekod secara manual. Masa yang ditambah begini ditanda sebagai ditaip, bukan direkod, supaya rekod tetap menceritakan apa yang benar-benar berlaku.\nRekod di luar lokasi kini memaparkan peta bersama latitud dan longitud tepatnya di bawah, serta sejauh mana ia dari pejabat yang sepatutnya. Satu angka untuk disemak, bukan sekadar pin untuk diteliti.\nMuat turun laporan sebagai hamparan, tepat seperti yang dipaparkan pada skrin — tempoh sama, tapisan sama, baris sama."
    - tag: added
      text: "Attendance now starts with your working mode. A two-way switch above the clock sits on \"Office / Home\" by default, so an ordinary day still takes one tap. Pick \"Site visit\" when you are heading to a customer and the punch window asks where you are going, for example \"Customer ABC, Shah Alam\". That destination is saved with the punch and shown to your manager.\nFirst time on the Attendance screen you get a short bubble beside the new switch explaining what the two modes mean. Close it and it stays closed. The full walkthrough is always there under \"What is this screen for?\" at the top."
      text_ms: "Kehadiran kini bermula dengan mod kerja anda. Suis dua pilihan di atas jam berada pada \"Pejabat / Rumah\" secara lalai, jadi hari biasa masih satu ketukan sahaja. Pilih \"Lawatan tapak\" apabila anda ke tempat pelanggan dan tetingkap rekod akan bertanya ke mana anda pergi, contohnya \"Customer ABC, Shah Alam\". Destinasi itu disimpan bersama rekod dan dipaparkan kepada pengurus anda.\nKali pertama anda ke skrin Kehadiran, satu gelembung ringkas muncul di sebelah suis baharu itu untuk menerangkan maksud kedua-dua mod. Tutup ia dan ia kekal tertutup. Panduan penuh sentiasa ada di bawah \"Apa fungsi skrin ini?\" di bahagian atas."
      link: "/app/attendance"
      link_text: "Open Attendance"
      link_text_ms: "Buka Kehadiran"
    - tag: improved
      text: "A declared site visit no longer counts as being off site. Your GPS is still recorded exactly as it reads, and it still shows on your manager's map, but the day is no longer marked amber for being outside a fence you already said you would be outside of. Late clock ins and early clock outs are unchanged and still need a reason.\nWorking from home no longer needs a registered home address. Staff can clock in from wherever they are that day, as long as they are on time, and the punch location is simply recorded. The stored home coordinates have been deleted and the screen HR used to register them is gone.\nThe separate remark box under the clock has been removed. Everything the app needs from you now appears in the same window as the selfie: the destination on a site visit, or a reason when you are late, off site, or your device cannot find your location. One place, one time, instead of two boxes asking the same thing."
      text_ms: "Lawatan tapak yang telah diisytiharkan tidak lagi dikira sebagai berada di luar lokasi. GPS anda tetap direkod tepat seperti bacaannya, dan tetap dipaparkan pada peta pengurus anda, cuma hari itu tidak lagi ditanda kuning kerana berada di luar kawasan yang anda sendiri sudah beritahu. Clock in lewat dan clock out awal tidak berubah dan tetap perlu sebab.\nBekerja dari rumah tidak lagi memerlukan alamat rumah yang didaftarkan. Kakitangan boleh clock in dari mana sahaja mereka berada pada hari itu, asalkan tepat pada masanya, dan lokasi rekod hanya disimpan sebagai catatan. Koordinat rumah yang tersimpan telah dipadam dan skrin yang digunakan HR untuk mendaftarkannya telah ditiadakan.\nKotak catatan berasingan di bawah jam telah ditiadakan. Segala yang diperlukan aplikasi daripada anda kini muncul dalam tetingkap yang sama dengan selfie: destinasi untuk lawatan tapak, atau sebab apabila anda lewat, di luar lokasi, atau peranti anda tidak dapat mencari lokasi. Satu tempat, satu kali, bukan dua kotak bertanya perkara sama."

- version: "1.4"
  date: "2026-08-18"
  entries:
    - tag: added
      text: "Oversight now has its own page, listing all six of its reports — Workforce, Attendance, Leave, Timesheet, Audit Logs and Profile Test Results — in one place. Open to managers, management and HR."
      text_ms: "Pengawasan kini mempunyai halamannya sendiri, menyenaraikan kesemua enam laporannya — Tenaga Kerja, Kehadiran, Cuti, Lembaran Masa, Log Audit dan Keputusan Ujian Profil — di satu tempat. Terbuka kepada pengurus, pengurusan dan HR."
    - tag: improved
      text: "Reports moved from its own item in the sidebar into Oversight, alongside the other company-wide reports it already shared an audience with, and is now labelled Workforce Reports to say what it actually covers."
      text_ms: "Laporan berpindah daripada item berasingan dalam bar sisi ke dalam Pengawasan, bersama laporan seluruh syarikat lain yang sudah berkongsi khalayak yang sama, dan kini dilabel Laporan Tenaga Kerja untuk menunjukkan apa yang sebenarnya diliputinya."
    - tag: added
      text: "New Projects screen under Workplace: every project in the company in one list, with how much each one is actually being used. Everyone can see it; managers, HR and management can add and edit. It replaces the old New Project screen, which could only create."
      text_ms: "Skrin Projek baharu di bawah Tempat Kerja: setiap projek syarikat dalam satu senarai, lengkap dengan sebanyak mana ia digunakan. Semua orang boleh melihatnya; pengurus, HR dan pengurusan boleh menambah dan menyunting. Ia menggantikan skrin Projek Baharu lama yang hanya boleh mencipta."
    - tag: improved
      text: "Sub-pillars are now one shared list used by every project, instead of a separate copy kept under each one. Adding a project no longer means retyping Management, Meeting and Technical, and renaming one changes it everywhere at once.\nTimesheet Setup now covers categories only. Projects and sub-pillars moved to the Projects screen, so there is one place to manage them.\nOn the timesheet, a project that previously had no sub-pillars now shows the sub-pillar step like every other project. \"The whole project\" stays the first choice, so booking time against it is still one tap."
      text_ms: "Sub-tiang kini satu senarai yang dikongsi setiap projek, bukan salinan berasingan di bawah setiap satu. Menambah projek tidak lagi bermakna menaip semula Pengurusan, Mesyuarat dan Teknikal, dan menukar nama satu sub-tiang mengubahnya di semua tempat sekali gus.\nTetapan Lembaran Masa kini merangkumi kategori sahaja. Projek dan sub-tiang telah berpindah ke skrin Projek, jadi ada satu tempat sahaja untuk mengurusnya.\nPada lembaran masa, projek yang sebelum ini tiada sub-tiang kini memaparkan langkah sub-tiang seperti projek lain. \"Keseluruhan projek\" kekal pilihan pertama, jadi merekod masa untuknya masih satu ketukan."
    - tag: added
      text: "Other Unijaya systems can now be given their own key to read AmanahKu's project list, staff directory and weekly effort. Each key is limited to exactly what that system needs, belongs to the system rather than to a person, and can be cancelled at any time from the super admin console.\nA developer reference for that connection now lives at /docs/api, with sample code and a one-click copy for AI coding tools."
      text_ms: "Sistem Unijaya yang lain kini boleh diberi kunci mereka sendiri untuk membaca senarai projek, direktori kakitangan dan usaha mingguan AmanahKu. Setiap kunci terhad kepada apa yang sistem itu perlukan sahaja, dimiliki oleh sistem itu dan bukan oleh seseorang, dan boleh dibatalkan bila-bila masa dari konsol super admin.\nRujukan pembangun untuk sambungan itu kini berada di /docs/api, lengkap dengan contoh kod dan satu klik salin untuk alat pengekodan AI."
      link: "/docs/api"
      link_text: "Open the API reference"
      link_text_ms: "Buka rujukan API"
    - tag: improved
      text: "Projects shared with other systems now carry their category tags, so a connected system can tell whether a project is Development, Maintenance, InHouse or Sales work."
      text_ms: "Projek yang dikongsi dengan sistem lain kini membawa tag kategorinya, supaya sistem yang bersambung tahu sama ada sesuatu projek ialah kerja Pembangunan, Penyelenggaraan, InHouse atau Jualan."
    - tag: fixed
      text: "The Add passkey button on Account & Security now works when you reach that screen by clicking around the app, not only on a fresh page load."
      text_ms: "Butang Tambah passkey pada skrin Akaun & Keselamatan kini berfungsi apabila anda sampai ke skrin itu dengan mengklik dalam aplikasi, bukan hanya semasa muat halaman baharu."
    - tag: fixed
      text: "Adding a note on the timesheet screen no longer breaks with an error after an app update. It now reloads once automatically to pick up the latest version."
      text_ms: "Menambah nota pada skrin lembaran masa tidak lagi rosak dengan ralat selepas kemas kini aplikasi. Ia kini memuat semula sekali secara automatik untuk mendapatkan versi terkini."
    - tag: improved
      text: "\"Where time went\" now opens the category, project or person you click on as a full page instead of a small side panel, with a trail at the top to get back. A person's month of entries now pages one week at a time instead of one long scroll, and each entry line is labelled with its day.\nThe Timesheet Reports screen now opens on This week by default, so who still owes a sheet is the first thing you see."
      text_ms: "\"Ke mana masa pergi\" kini membuka kategori, projek atau individu yang anda klik sebagai halaman penuh, bukan lagi panel kecil di tepi, dengan penanda jejak di atas untuk kembali. Rekod sebulan seorang individu kini dipaparkan seminggu pada satu masa, bukan skrol panjang, dan setiap baris rekod dilabel dengan harinya.\nSkrin Laporan Lembaran Masa kini terbuka pada tab Minggu Ini secara lalai, supaya siapa yang masih belum menghantar lembaran menjadi perkara pertama yang dilihat."
    - tag: added
      text: "The Review tab is now a read-only week-by-week view of your own timesheet entries, with arrows and a dropdown to jump between weeks. Each day shows what you logged as small category and project tags, grouped together even when you logged more than one thing that day — click any entry to jump straight into editing it on the Record tab. It replaces the old cost list and time-spent breakdown, which only money roles could see."
      text_ms: "Tab Semak kini memaparkan minggu lembaran masa anda sendiri secara baca-sahaja, dengan anak panah dan senarai lungsur untuk melompat antara minggu. Setiap hari memaparkan apa yang anda rekod sebagai tag kecil kategori dan projek, dikumpul bersama walaupun anda merekod lebih daripada satu perkara pada hari yang sama — klik mana-mana entri untuk terus menyunting di tab Rekod. Ia menggantikan senarai kos lama dan pecahan masa yang hanya boleh dilihat oleh peranan berkaitan kewangan."

- version: "1.3"
  date: "2026-08-14"
  entries:
    - tag: improved
      text: "Adding a card to the board now opens the full card right away — no more typing a title first and reopening it to add anything else."
      text_ms: "Menambah kad pada papan kini terus membuka kad penuh — tidak perlu taip tajuk dahulu dan buka semula untuk tambah butiran lain."
    - tag: added
      text: "Cards on the board can now hold links — a document, a meeting link, anything — with a name and URL, shown as clickable buttons."
      text_ms: "Kad pada papan kini boleh membawa pautan — dokumen, pautan mesyuarat, apa sahaja — dengan nama dan URL, dipaparkan sebagai butang boleh klik."
    - tag: fixed
      text: "Hitting the request limit now shows the app's own error page instead of a bare browser error."
      text_ms: "Mencecah had permintaan kini memaparkan halaman ralat aplikasi sendiri, bukan ralat pelayar kosong."

- version: "1.2"
  date: "2026-08-12"
  entries:
    - tag: improved
      text: "Clocking in and out now always opens the camera for a selfie. Before, it only asked when you were away from the office or your location could not be found. The reason box is unchanged: it still appears only when you are off-site, have no location, clock in late or clock out early."
      text_ms: "Clock in dan clock out kini sentiasa membuka kamera untuk swafoto. Sebelum ini ia hanya diminta apabila anda berada di luar pejabat atau lokasi anda tidak dapat dikesan. Kotak sebab tidak berubah: ia masih muncul hanya apabila anda berada di luar pejabat, tiada lokasi, clock in lewat atau clock out awal."

- version: "1.1"
  date: "2026-08-06"
  entries:
    - tag: added
      text: "New Changelog screen: see what shipped and when, right from the sidebar."
      text_ms: "Skrin Log Perubahan baharu: lihat apa yang dilancarkan dan bila, terus dari bar sisi."
    - tag: improved
      text: "Timesheet add-entry now opens in one popup with rich-text notes.\nTimesheet add-entry popup now scales up on wider screens instead of staying phone-width.\nTimesheet category colours now group by what the category actually is, instead of cycling arbitrarily."
      text_ms: "Timesheet add-entry now opens in one popup with rich-text notes.\nPopup tambah entri lembaran masa kini berskala lebih besar pada skrin luas, bukan kekal selebar telefon.\nWarna kategori lembaran masa kini berkumpul mengikut jenis kategori sebenar, bukan berulang secara rawak."
    - tag: added
      text: "HR and director can now reverse a misclicked clock-in or clock-out, from an employee's Attendance Reports drill-down."
      text_ms: "HR dan director kini boleh membatalkan clock-in atau clock-out yang tersilap klik, daripada rekod terperinci Laporan Kehadiran pekerja."
    - tag: fixed
      text: "Board and the org chart now share the same page width as every other screen."
      text_ms: "T.A.A. dan carta organisasi kini berkongsi lebar halaman yang sama dengan skrin lain."
    - tag: fixed
      text: "The Reports & Analytics screen is now limited to managers, HR and above, matching the rest of the oversight screens."
      text_ms: "Skrin Laporan & Analitik kini terhad kepada pengurus, HR dan ke atas, sejajar dengan skrin pengawasan yang lain."
    - tag: improved
      text: "Messages, the unread badge and the message panel now refresh automatically every few seconds — no more reopening a conversation to see a new reply. This checks for updates on a short timer rather than pushing them instantly, so there is still a small delay, not true live chat."
      text_ms: "Mesej, lencana belum dibaca dan panel mesej kini muat semula secara automatik setiap beberapa saat — tidak perlu buka semula perbualan untuk lihat balasan baharu. Ini menyemak kemas kini pada tempoh masa yang singkat, bukan menghantar terus serta-merta, jadi masih ada sedikit kelewatan, bukan sembang langsung sepenuhnya."
    - tag: added
      text: "Knowledge Bank lessons can now carry up to 10 pictures, each with its own caption. Drag to reorder, add or remove pictures when editing, and tap any picture to view it full-screen."
      text_ms: "Pengajaran Bank Pengetahuan kini boleh membawa sehingga 10 gambar, setiap satu dengan kapsyennya sendiri. Seret untuk susun semula, tambah atau buang gambar semasa menyunting, dan ketik mana-mana gambar untuk lihat skrin penuh."
    - tag: improved
      text: "Document Vault has a fresh look: documents are grouped by category with clearer icons, and tapping one opens its details — owner, file and download or delete — in a side panel."
      text_ms: "Peti Dokumen kini bergaya baharu: dokumen dikumpulkan mengikut kategori dengan ikon yang lebih jelas, dan mengetik satu dokumen membuka butirannya — pemilik, fail dan muat turun atau padam — dalam panel sisi."

- version: "1.0"
  date: "2026-08-02"
  entries:
    - tag: added
      text: "Amanahku is now the official HR system for everyday work: attendance, timesheets, the team board, messages and the Knowledge Bank all run here from today."
    - tag: added
      text: "Sign in with your Google account, and tick \"Remember me\" so you stay signed in on your own device."
    - tag: added
      text: "Transfer of Technology (TOT): a year lineup screen, HR-owned roster, presenter assignment, reactions, private ratings, a discussion under each session, and reminders before the day. Three years of past sessions are already loaded."
    - tag: added
      text: "Knowledge Bank revamp, with the TOT month counted for each presenter."
    - tag: added
      text: "Timesheets: day-first capture with Record and Review tabs, a live week-percent shelf, and a report you can drill from a number down to the sheet behind it."
    - tag: added
      text: "Team board: real due dates, colour labels, an optional project, people on a card, and an autosaving detail window."
    - tag: added
      text: "Attendance: clock in and out with GPS matched to your branch site, add a remark, and get a reminder bell before your shift starts."
    - tag: added
      text: "Messages: send images and files, or snap a photo from your phone camera."
    - tag: added
      text: "Alerts on your phone and desktop for new bells, plus an email for the ones you must not miss while away."
    - tag: added
      text: "Install Amanahku to your Home Screen and open it like an app."
    - tag: added
      text: "If something goes wrong, the screen now shows a reference code you can quote to HR or support."
    - tag: improved
      text: "A new look across sign-in, the workspace picker, the dashboard and every screen, with a collapsible sidebar and one shared page width."
    - tag: improved
      text: "Your nickname shows beside your full name across the app."
    - tag: improved
      text: "The org chart moves one seat at a time and shows faces instead of names."
    - tag: improved
      text: "Text and greys across the app now meet the WCAG AA contrast standard."
    - tag: fixed
      text: "Camera and GPS work again on the clock-in screen."
    - tag: fixed
      text: "Uploaded files keep a safe, readable name when you download them."
    - tag: fixed
      text: "The end-of-shift email is gone. The reminder bell alone tells you to clock out."
