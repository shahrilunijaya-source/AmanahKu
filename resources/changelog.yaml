# Newest release first. tag is one of: added, improved, fixed.
# text_ms is optional — falls back to `text` when omitted.
# A \n inside a double-quoted text renders as a line break (the screen sets
# white-space: pre-line). Keep text and text_ms broken at the same places.
# link/link_text/link_text_ms are optional too: they render a button beside the
# entry, for a release note that names a screen worth opening.
#
# Version is semver MAJOR.MINOR, not CalVer, and tracks what actually lands on
# gitlab main (prod) — not dev commits. Baseline 1.0 is the 2026-08-02 gitlab
# main launch commit. Bump MINOR for an ordinary release; bump MAJOR only for
# something meaningful (a real breaking or headline change), never on a fixed
# cadence.
- version: "1.5"
  date: "2026-08-21"
  entries:
    - tag: added
      text: "Attendance now starts with your working mode. A two-way switch above the clock sits on \"Office / Home\" by default, so an ordinary day still takes one tap. Pick \"Site visit\" when you are heading to a customer and the punch window asks where you are going, for example \"Customer ABC, Shah Alam\". That destination is saved with the punch and shown to your manager."
      text_ms: "Kehadiran kini bermula dengan mod kerja anda. Suis dua pilihan di atas jam berada pada \"Pejabat / Rumah\" secara lalai, jadi hari biasa masih satu ketukan sahaja. Pilih \"Lawatan tapak\" apabila anda ke tempat pelanggan dan tetingkap rekod akan bertanya ke mana anda pergi, contohnya \"Customer ABC, Shah Alam\". Destinasi itu disimpan bersama rekod dan dipaparkan kepada pengurus anda."
      link: "/app/attendance"
      link_text: "Open Attendance"
      link_text_ms: "Buka Kehadiran"
    - tag: improved
      text: "A declared site visit no longer counts as being off site. Your GPS is still recorded exactly as it reads, and it still shows on your manager's map, but the day is no longer marked amber for being outside a fence you already said you would be outside of. Late clock ins and early clock outs are unchanged and still need a reason."
      text_ms: "Lawatan tapak yang telah diisytiharkan tidak lagi dikira sebagai berada di luar lokasi. GPS anda tetap direkod tepat seperti bacaannya, dan tetap dipaparkan pada peta pengurus anda, cuma hari itu tidak lagi ditanda kuning kerana berada di luar kawasan yang anda sendiri sudah beritahu. Clock in lewat dan clock out awal tidak berubah dan tetap perlu sebab."
    - tag: improved
      text: "Working from home no longer needs a registered home address. Staff can clock in from wherever they are that day, as long as they are on time, and the punch location is simply recorded. The stored home coordinates have been deleted and the screen HR used to register them is gone."
      text_ms: "Bekerja dari rumah tidak lagi memerlukan alamat rumah yang didaftarkan. Kakitangan boleh clock in dari mana sahaja mereka berada pada hari itu, asalkan tepat pada masanya, dan lokasi rekod hanya disimpan sebagai catatan. Koordinat rumah yang tersimpan telah dipadam dan skrin yang digunakan HR untuk mendaftarkannya telah ditiadakan."
    - tag: improved
      text: "The separate remark box under the clock has been removed. Everything the app needs from you now appears in the same window as the selfie: the destination on a site visit, or a reason when you are late, off site, or your device cannot find your location. One place, one time, instead of two boxes asking the same thing."
      text_ms: "Kotak catatan berasingan di bawah jam telah ditiadakan. Segala yang diperlukan aplikasi daripada anda kini muncul dalam tetingkap yang sama dengan selfie: destinasi untuk lawatan tapak, atau sebab apabila anda lewat, di luar lokasi, atau peranti anda tidak dapat mencari lokasi. Satu tempat, satu kali, bukan dua kotak bertanya perkara sama."
    - tag: added
      text: "First time on the Attendance screen you get a short bubble beside the new switch explaining what the two modes mean. Close it and it stays closed. The full walkthrough is always there under \"What is this screen for?\" at the top."
      text_ms: "Kali pertama anda ke skrin Kehadiran, satu gelembung ringkas muncul di sebelah suis baharu itu untuk menerangkan maksud kedua-dua mod. Tutup ia dan ia kekal tertutup. Panduan penuh sentiasa ada di bawah \"Apa fungsi skrin ini?\" di bahagian atas."

- version: "1.4"
  date: "2026-08-18"
  entries:
    - tag: added
      text: "Oversight now has its own page, listing all six of its reports — Workforce, Attendance, Leave, Timesheet, Audit Logs and Profile Test Results — in one place. Open to managers, management and HR."
      text_ms: "Pengawasan kini mempunyai halamannya sendiri, menyenaraikan kesemua enam laporannya — Tenaga Kerja, Kehadiran, Cuti, Lembaran Masa, Log Audit dan Keputusan Ujian Profil — di satu tempat. Terbuka kepada pengurus, pengurusan dan HR."
    - tag: improved
      text: "Reports moved from its own item in the sidebar into Oversight, alongside the other company-wide reports it already shared an audience with, and is now labelled Workforce Reports to say what it actually covers."
      text_ms: "Laporan berpindah daripada item berasingan dalam bar sisi ke dalam Pengawasan, bersama laporan seluruh syarikat lain yang sudah berkongsi khalayak yang sama, dan kini dilabel Laporan Tenaga Kerja untuk menunjukkan apa yang sebenarnya diliputinya."
    - tag: added
      text: "New Projects screen under Workplace: every project in the company in one list, with how much each one is actually being used. Everyone can see it; managers, HR and management can add and edit. It replaces the old New Project screen, which could only create."
      text_ms: "Skrin Projek baharu di bawah Tempat Kerja: setiap projek syarikat dalam satu senarai, lengkap dengan sebanyak mana ia digunakan. Semua orang boleh melihatnya; pengurus, HR dan pengurusan boleh menambah dan menyunting. Ia menggantikan skrin Projek Baharu lama yang hanya boleh mencipta."
    - tag: improved
      text: "Sub-pillars are now one shared list used by every project, instead of a separate copy kept under each one. Adding a project no longer means retyping Management, Meeting and Technical, and renaming one changes it everywhere at once."
      text_ms: "Sub-tiang kini satu senarai yang dikongsi setiap projek, bukan salinan berasingan di bawah setiap satu. Menambah projek tidak lagi bermakna menaip semula Pengurusan, Mesyuarat dan Teknikal, dan menukar nama satu sub-tiang mengubahnya di semua tempat sekali gus."
    - tag: improved
      text: "Timesheet Setup now covers categories only. Projects and sub-pillars moved to the Projects screen, so there is one place to manage them."
      text_ms: "Tetapan Lembaran Masa kini merangkumi kategori sahaja. Projek dan sub-tiang telah berpindah ke skrin Projek, jadi ada satu tempat sahaja untuk mengurusnya."
    - tag: improved
      text: "On the timesheet, a project that previously had no sub-pillars now shows the sub-pillar step like every other project. \"The whole project\" stays the first choice, so booking time against it is still one tap."
      text_ms: "Pada lembaran masa, projek yang sebelum ini tiada sub-tiang kini memaparkan langkah sub-tiang seperti projek lain. \"Keseluruhan projek\" kekal pilihan pertama, jadi merekod masa untuknya masih satu ketukan."
    - tag: added
      text: "Other Unijaya systems can now be given their own key to read AmanahKu's project list, staff directory and weekly effort. Each key is limited to exactly what that system needs, belongs to the system rather than to a person, and can be cancelled at any time from the super admin console.\nA developer reference for that connection now lives at /docs/api, with sample code and a one-click copy for AI coding tools."
      text_ms: "Sistem Unijaya yang lain kini boleh diberi kunci mereka sendiri untuk membaca senarai projek, direktori kakitangan dan usaha mingguan AmanahKu. Setiap kunci terhad kepada apa yang sistem itu perlukan sahaja, dimiliki oleh sistem itu dan bukan oleh seseorang, dan boleh dibatalkan bila-bila masa dari konsol super admin.\nRujukan pembangun untuk sambungan itu kini berada di /docs/api, lengkap dengan contoh kod dan satu klik salin untuk alat pengekodan AI."
      link: "/docs/api"
      link_text: "Open the API reference"
      link_text_ms: "Buka rujukan API"
    - tag: improved
      text: "Projects shared with other systems now carry their category tags, so a connected system can tell whether a project is Development, Maintenance, InHouse or Sales work."
      text_ms: "Projek yang dikongsi dengan sistem lain kini membawa tag kategorinya, supaya sistem yang bersambung tahu sama ada sesuatu projek ialah kerja Pembangunan, Penyelenggaraan, InHouse atau Jualan."
    - tag: fixed
      text: "The Add passkey button on Account & Security now works when you reach that screen by clicking around the app, not only on a fresh page load."
      text_ms: "Butang Tambah passkey pada skrin Akaun & Keselamatan kini berfungsi apabila anda sampai ke skrin itu dengan mengklik dalam aplikasi, bukan hanya semasa muat halaman baharu."
    - tag: fixed
      text: "Adding a note on the timesheet screen no longer breaks with an error after an app update. It now reloads once automatically to pick up the latest version."
      text_ms: "Menambah nota pada skrin lembaran masa tidak lagi rosak dengan ralat selepas kemas kini aplikasi. Ia kini memuat semula sekali secara automatik untuk mendapatkan versi terkini."
    - tag: improved
      text: "\"Where time went\" now opens the category, project or person you click on as a full page instead of a small side panel, with a trail at the top to get back. A person's month of entries now pages one week at a time instead of one long scroll, and each entry line is labelled with its day."
      text_ms: "\"Ke mana masa pergi\" kini membuka kategori, projek atau individu yang anda klik sebagai halaman penuh, bukan lagi panel kecil di tepi, dengan penanda jejak di atas untuk kembali. Rekod sebulan seorang individu kini dipaparkan seminggu pada satu masa, bukan skrol panjang, dan setiap baris rekod dilabel dengan harinya."
    - tag: improved
      text: "The Timesheet Reports screen now opens on This week by default, so who still owes a sheet is the first thing you see."
      text_ms: "Skrin Laporan Lembaran Masa kini terbuka pada tab Minggu Ini secara lalai, supaya siapa yang masih belum menghantar lembaran menjadi perkara pertama yang dilihat."
    - tag: added
      text: "The Review tab is now a read-only week-by-week view of your own timesheet entries, with arrows and a dropdown to jump between weeks. Each day shows what you logged as small category and project tags, grouped together even when you logged more than one thing that day — click any entry to jump straight into editing it on the Record tab. It replaces the old cost list and time-spent breakdown, which only money roles could see."
      text_ms: "Tab Semak kini memaparkan minggu lembaran masa anda sendiri secara baca-sahaja, dengan anak panah dan senarai lungsur untuk melompat antara minggu. Setiap hari memaparkan apa yang anda rekod sebagai tag kecil kategori dan projek, dikumpul bersama walaupun anda merekod lebih daripada satu perkara pada hari yang sama — klik mana-mana entri untuk terus menyunting di tab Rekod. Ia menggantikan senarai kos lama dan pecahan masa yang hanya boleh dilihat oleh peranan berkaitan kewangan."

- version: "1.3"
  date: "2026-08-14"
  entries:
    - tag: improved
      text: "Adding a card to the board now opens the full card right away — no more typing a title first and reopening it to add anything else."
      text_ms: "Menambah kad pada papan kini terus membuka kad penuh — tidak perlu taip tajuk dahulu dan buka semula untuk tambah butiran lain."
    - tag: added
      text: "Cards on the board can now hold links — a document, a meeting link, anything — with a name and URL, shown as clickable buttons."
      text_ms: "Kad pada papan kini boleh membawa pautan — dokumen, pautan mesyuarat, apa sahaja — dengan nama dan URL, dipaparkan sebagai butang boleh klik."
    - tag: fixed
      text: "Hitting the request limit now shows the app's own error page instead of a bare browser error."
      text_ms: "Mencecah had permintaan kini memaparkan halaman ralat aplikasi sendiri, bukan ralat pelayar kosong."

- version: "1.2"
  date: "2026-08-12"
  entries:
    - tag: improved
      text: "Clocking in and out now always opens the camera for a selfie. Before, it only asked when you were away from the office or your location could not be found. The reason box is unchanged: it still appears only when you are off-site, have no location, clock in late or clock out early."
      text_ms: "Clock in dan clock out kini sentiasa membuka kamera untuk swafoto. Sebelum ini ia hanya diminta apabila anda berada di luar pejabat atau lokasi anda tidak dapat dikesan. Kotak sebab tidak berubah: ia masih muncul hanya apabila anda berada di luar pejabat, tiada lokasi, clock in lewat atau clock out awal."

- version: "1.1"
  date: "2026-08-06"
  entries:
    - tag: added
      text: "New Changelog screen: see what shipped and when, right from the sidebar."
      text_ms: "Skrin Log Perubahan baharu: lihat apa yang dilancarkan dan bila, terus dari bar sisi."
    - tag: improved
      text: "Timesheet add-entry now opens in one popup with rich-text notes."
    - tag: improved
      text: "Timesheet add-entry popup now scales up on wider screens instead of staying phone-width."
      text_ms: "Popup tambah entri lembaran masa kini berskala lebih besar pada skrin luas, bukan kekal selebar telefon."
    - tag: improved
      text: "Timesheet category colours now group by what the category actually is, instead of cycling arbitrarily."
      text_ms: "Warna kategori lembaran masa kini berkumpul mengikut jenis kategori sebenar, bukan berulang secara rawak."
    - tag: added
      text: "HR and director can now reverse a misclicked clock-in or clock-out, from an employee's Attendance Reports drill-down."
      text_ms: "HR dan director kini boleh membatalkan clock-in atau clock-out yang tersilap klik, daripada rekod terperinci Laporan Kehadiran pekerja."
    - tag: fixed
      text: "Board and the org chart now share the same page width as every other screen."
      text_ms: "T.A.A. dan carta organisasi kini berkongsi lebar halaman yang sama dengan skrin lain."
    - tag: fixed
      text: "The Reports & Analytics screen is now limited to managers, HR and above, matching the rest of the oversight screens."
      text_ms: "Skrin Laporan & Analitik kini terhad kepada pengurus, HR dan ke atas, sejajar dengan skrin pengawasan yang lain."
    - tag: improved
      text: "Messages, the unread badge and the message panel now refresh automatically every few seconds — no more reopening a conversation to see a new reply. This checks for updates on a short timer rather than pushing them instantly, so there is still a small delay, not true live chat."
      text_ms: "Mesej, lencana belum dibaca dan panel mesej kini muat semula secara automatik setiap beberapa saat — tidak perlu buka semula perbualan untuk lihat balasan baharu. Ini menyemak kemas kini pada tempoh masa yang singkat, bukan menghantar terus serta-merta, jadi masih ada sedikit kelewatan, bukan sembang langsung sepenuhnya."
    - tag: added
      text: "Knowledge Bank lessons can now carry up to 10 pictures, each with its own caption. Drag to reorder, add or remove pictures when editing, and tap any picture to view it full-screen."
      text_ms: "Pengajaran Bank Pengetahuan kini boleh membawa sehingga 10 gambar, setiap satu dengan kapsyennya sendiri. Seret untuk susun semula, tambah atau buang gambar semasa menyunting, dan ketik mana-mana gambar untuk lihat skrin penuh."
    - tag: improved
      text: "Document Vault has a fresh look: documents are grouped by category with clearer icons, and tapping one opens its details — owner, file and download or delete — in a side panel."
      text_ms: "Peti Dokumen kini bergaya baharu: dokumen dikumpulkan mengikut kategori dengan ikon yang lebih jelas, dan mengetik satu dokumen membuka butirannya — pemilik, fail dan muat turun atau padam — dalam panel sisi."

# Recovered from the old, now-deleted config/changelog.php (commit c8bca8f,
# corrected by 3376b80) for continuity — this was the app's real 1.0 launch.
# No text_ms on these: the old system never carried Malay copy either.
- version: "1.0"
  date: "2026-08-02"
  entries:
    - tag: added
      text: "Amanahku is now the official HR system for everyday work: attendance, timesheets, the team board, messages and the Knowledge Bank all run here from today."
    - tag: added
      text: "Sign in with your Google account, and tick \"Remember me\" so you stay signed in on your own device."
    - tag: added
      text: "Transfer of Technology (TOT): a year lineup screen, HR-owned roster, presenter assignment, reactions, private ratings, a discussion under each session, and reminders before the day. Three years of past sessions are already loaded."
    - tag: added
      text: "Knowledge Bank revamp, with the TOT month counted for each presenter."
    - tag: added
      text: "Timesheets: day-first capture with Record and Review tabs, a live week-percent shelf, and a report you can drill from a number down to the sheet behind it."
    - tag: added
      text: "Team board: real due dates, colour labels, an optional project, people on a card, and an autosaving detail window."
    - tag: added
      text: "Attendance: clock in and out with GPS matched to your branch site, add a remark, and get a reminder bell before your shift starts."
    - tag: added
      text: "Messages: send images and files, or snap a photo from your phone camera."
    - tag: added
      text: "Alerts on your phone and desktop for new bells, plus an email for the ones you must not miss while away."
    - tag: added
      text: "Install Amanahku to your Home Screen and open it like an app."
    - tag: added
      text: "If something goes wrong, the screen now shows a reference code you can quote to HR or support."
    - tag: improved
      text: "A new look across sign-in, the workspace picker, the dashboard and every screen, with a collapsible sidebar and one shared page width."
    - tag: improved
      text: "Your nickname shows beside your full name across the app."
    - tag: improved
      text: "The org chart moves one seat at a time and shows faces instead of names."
    - tag: improved
      text: "Text and greys across the app now meet the WCAG AA contrast standard."
    - tag: fixed
      text: "Camera and GPS work again on the clock-in screen."
    - tag: fixed
      text: "Uploaded files keep a safe, readable name when you download them."
    - tag: fixed
      text: "The end-of-shift email is gone. The reminder bell alone tells you to clock out."
