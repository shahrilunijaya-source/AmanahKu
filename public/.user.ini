; Per-directory PHP limits, read by PHP-FPM (prod) and LiteSpeed (staging) for every
; request through public/index.php. Arrives with `git pull`, no restart needed; PHP
; re-reads it within user_ini.cache_ttl (5 minutes by default).
;
; The app's largest upload rule is 10 MB (backgrounds, covers, project and onboarding
; files), and a message can carry several attachments, hence the wider form limit.
; nginx has its own cap in front of this (client_max_body_size, default 1 MB) that
; only the host owner can raise; it must be at least post_max_size.
upload_max_filesize = 12M
post_max_size = 50M
