name: CI

on:
  push:
    branches: [main, master, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint, dependency audit, and the full suite on the fast SQLite driver ──────────
  test:
    name: Lint, audit & tests (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd, zip
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Code style (Pint, dry-run)
        run: vendor/bin/pint --test

      - name: Dependency security audit
        run: composer audit --no-interaction

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: JS tests (bun)
        run: bun test

      - name: Tests
        run: php artisan test

  # ── Committed-asset freshness (AK-BUILD-01). The staging host builds nothing: it ──
  # ── serves the public/build committed to the repo, so a source change with no ─────
  # ── rebuild ships the previous stylesheet and fails silently — no error, no failing
  # ── test, just the old look. This job rebuilds and fails if the result differs.
  # ──
  # ── `view:cache` is not optional. resources/css/app.css has
  # ── `@source '../../storage/framework/views/*.php'`, so Tailwind reads the compiled
  # ── Blade cache. Left to whatever a machine happens to have compiled, that makes the
  # ── CSS vary per machine; compiling every view first makes the cache a pure function
  # ── of the Blade sources, which is what makes this comparison meaningful at all.
  assets:
    name: Committed assets match sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd, zip
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      # Tailwind scans this directory; compile every view so the scan is deterministic.
      - name: Compile all Blade views
        run: php artisan view:cache

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install

      - name: Rebuild assets
        run: bun run build

      # CSS only, deliberately. Tailwind staleness is the silent failure — a dropped
      # utility just stops applying, with no error anywhere — and the CSS bytes are
      # identical across every machine tested (this runner, a local dev box, the
      # staging host). Rolldown's JS chunk bytes are NOT: same lockfile, same bun
      # 1.3.14, same rolldown 1.0.3, yet the module order inside app-*.js differs per
      # environment, so gating on JS would fail for reasons that have nothing to do
      # with staleness. A stale JS bundle is also the louder failure of the two: the
      # feature is missing or the console throws. Revisit if rolldown output becomes
      # reproducible.
      - name: Fail if committed CSS is stale
        run: |
          if [ -n "$(git status --porcelain -- 'public/build/assets/*.css')" ]; then
            echo "::error::Committed CSS does not match the sources. Run 'php artisan view:cache && bun run build' and commit public/build."
            git status --porcelain -- 'public/build/assets/*.css'
            exit 1
          fi
          echo "Committed CSS matches a clean rebuild."

  # ── Static analysis (PHPStan + Larastan). Larastan is installed here rather than ──
  # ── pinned in composer.json so the runtime lock stays lean; bump the constraint ───
  # ── into require-dev once the baseline in phpstan.neon is clean at the target level.
  static-analysis:
    name: Static analysis (phpstan/larastan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Larastan
        run: composer require --dev "larastan/larastan:^3.0" --no-interaction --no-progress

      - name: PHPStan
        run: composer analyse

  # ── MySQL-parity run for the money / tenant-isolation / attendance suites, where ──
  # ── SQLite and MySQL semantics can diverge (AK-TEST-01). phpunit.xml <env> entries ─
  # ── are non-forcing, so the DB_* job env below takes precedence over the sqlite defaults.
  test-mysql:
    name: Tests (MySQL parity)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: amanahku_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: amanahku_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: MySQL-parity suites
        run: php artisan test --filter='Payroll|LeaveAccrual|CrossTenantDenial|ClockService'

  # ── Coverage gate (AK-TEST-03). Uses pcov. The 80% threshold is the project target; ─
  # ── if the first green run reports below it, tune the number to the measured baseline ─
  # ── and ratchet up, rather than lowering the bar permanently.
  coverage:
    name: Coverage (>=80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd, zip
          coverage: pcov

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Tests with coverage gate
        run: php artisan test --coverage --min=80
