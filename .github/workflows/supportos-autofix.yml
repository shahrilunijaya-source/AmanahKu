name: SupportOS auto-fix

# Integration contract with SupportOS (Unijaya OS helpdesk agent).
#
# SupportOS authors a fix on its own side and pushes a branch named
# supportos/<severity>/<ticket-id>-<slug>, e.g. supportos/low/AK-412-null-payslip.
# From there this workflow takes over:
#   1. opens a PR into `staging`
#   2. waits for the existing CI workflow to go green on that PR
#   3. squash-merges it
#   4. deploys staging in the same run (ssh + git pull + deploy.sh), smoke-tests it
#
# Only `low` auto-merges. Any other severity still gets a PR and a CI run, but stops
# there for a human to merge — the branch name is the contract, and a SupportOS bug
# that mislabels a severity cannot silently ship itself. This workflow never touches
# main or production.
#
# A deploy that fails, or that leaves staging not answering, is rolled back to the
# previous commit on the server automatically.

on:
  push:
    branches:
      - 'supportos/**'
      - 'staging'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One fixed group, not one per branch: two SupportOS branches landing at once would
# otherwise deploy the same server simultaneously, and a rollback could revert the
# other ticket's commit. Runs queue instead.
concurrency:
  group: supportos-staging
  cancel-in-progress: false

jobs:
  # ── Branch -> PR -> green CI -> merged into staging ────────────────────────────
  merge:
    if: startsWith(github.ref, 'refs/heads/supportos/')
    name: PR into staging, merge when green
    runs-on: ubuntu-latest
    outputs:
      severity: ${{ steps.severity.outputs.value }}
      merge_sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      # supportos/<severity>/<ticket>-<slug> -> <severity>
      - name: Read the severity off the branch name
        id: severity
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          value="$(printf '%s' "$BRANCH" | cut -d/ -f2)"
          case "$value" in
            low|medium|high|critical) ;;
            *) echo "::error::branch must be supportos/<severity>/<ticket>-<slug>, got '$BRANCH'"; exit 1 ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "severity: $value"

      - name: Open (or reuse) the PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          SEVERITY: ${{ steps.severity.outputs.value }}
        run: |
          if [ "$SEVERITY" = low ]; then
            BODY=" Merges itself once CI is green, then deploys to staging."
          else
            BODY=" Above the auto-merge threshold — CI runs, but a human merges this one."
          fi
          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create \
              --base staging \
              --head "$BRANCH" \
              --title "SupportOS auto-fix ($SEVERITY): $BRANCH" \
              --body "Automated fix pushed by SupportOS, severity **$SEVERITY**.$BODY"
          fi
          gh pr view "$BRANCH" --json number,url --jq '"PR " + (.number|tostring) + " " + .url'

      # Waits for the CI workflow the PR itself triggered. Fails the job if any
      # required check fails, so a red fix never reaches staging.
      - name: Wait for CI
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # ci.yml can sit queued for a while; "no checks reported yet" is not a
          # failure, so retry until the checks exist before watching them.
          for i in $(seq 1 20); do
            gh pr checks "$BRANCH" >/dev/null 2>&1 && break
            echo "waiting for checks to register ($i/20)"; sleep 15
          done
          gh pr checks "$BRANCH" --watch --fail-fast

      - name: Stop here (severity above the auto-merge threshold)
        if: steps.severity.outputs.value != 'low'
        run: echo "::notice::CI is green. Severity is '${{ steps.severity.outputs.value }}', so this PR waits for a human to merge."

      - name: Merge
        id: merge
        if: steps.severity.outputs.value == 'low'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          gh pr merge "$BRANCH" --squash --delete-branch
          # The exact squash commit, so a rollback reverts this ticket and not
          # whatever else happened to land on staging afterwards.
          sha="$(gh pr view "$BRANCH" --json mergeCommit --jq .mergeCommit.oid)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "merged as $sha"

  # ── Deploy staging: ssh, pull, deploy.sh (mirrors the GitLab .ssh_deploy block) ─
  deploy:
    # Runs either after the auto-merge above (same run: a merge made with
    # GITHUB_TOKEN does NOT trigger a fresh push workflow) or on a human push
    # straight to staging, in which case `merge` is skipped.
    needs: [merge]
    if: |
      always() && (
        (needs.merge.result == 'success' && needs.merge.outputs.severity == 'low') ||
        (needs.merge.result == 'skipped' && github.ref == 'refs/heads/staging')
      )
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://amanahku-staging.myappsonline.net
    steps:
      - name: Check the deploy secrets are present
        env:
          AMANAHKU_STAGING_SSH_KEY: ${{ secrets.AMANAHKU_STAGING_SSH_KEY }}
          AMANAHKU_STAGING_HOST: ${{ secrets.AMANAHKU_STAGING_HOST }}
          AMANAHKU_STAGING_USER: ${{ secrets.AMANAHKU_STAGING_USER }}
          AMANAHKU_STAGING_PORT: ${{ secrets.AMANAHKU_STAGING_PORT }}
          AMANAHKU_STAGING_PATH: ${{ secrets.AMANAHKU_STAGING_PATH }}
        run: |
          set -eu
          for v in SSH_KEY HOST USER PORT PATH; do
            eval "val=\${AMANAHKU_STAGING_$v:-}"
            test -n "$val" || { echo "::error::secret AMANAHKU_STAGING_$v is not set"; exit 1; }
          done

      - name: Set up SSH
        env:
          HOST: ${{ secrets.AMANAHKU_STAGING_HOST }}
          PORT: ${{ secrets.AMANAHKU_STAGING_PORT }}
          KEY: ${{ secrets.AMANAHKU_STAGING_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Remembered before the pull so the rollback below has somewhere to go back to.
      - name: Record the commit currently on staging
        env:
          SSH: ssh -i ~/.ssh/deploy_key -p ${{ secrets.AMANAHKU_STAGING_PORT }} ${{ secrets.AMANAHKU_STAGING_USER }}@${{ secrets.AMANAHKU_STAGING_HOST }}
          DEPLOY_PATH: ${{ secrets.AMANAHKU_STAGING_PATH }}
        run: |
          set -eu
          prev="$($SSH "cd '$DEPLOY_PATH' && git rev-parse HEAD")"
          echo "PREV_SHA=$prev" >> "$GITHUB_ENV"
          echo "staging is currently at $prev"

      - name: Deploy
        env:
          SSH: ssh -i ~/.ssh/deploy_key -p ${{ secrets.AMANAHKU_STAGING_PORT }} ${{ secrets.AMANAHKU_STAGING_USER }}@${{ secrets.AMANAHKU_STAGING_HOST }}
          DEPLOY_PATH: ${{ secrets.AMANAHKU_STAGING_PATH }}
        run: |
          set -eu
          # Refuse anything that is not the staging checkout: a wrong DEPLOY_PATH
          # would run deploy.sh against production on the same host.
          $SSH "
            set -eu
            cd '$DEPLOY_PATH'
            test \"\$(git rev-parse --abbrev-ref HEAD)\" = staging || { echo 'FATAL: target checkout is not on the staging branch'; exit 1; }
            grep -q '^APP_ENV=staging' .env || { echo 'FATAL: target .env is not APP_ENV=staging'; exit 1; }
            git pull origin staging
            bash deploy.sh
          "

      # A deploy.sh that exits 0 can still leave a white screen (a bad view cache, a
      # missing binding). Ask the running site, not the deploy script.
      - name: Smoke test
        env:
          URL: https://amanahku-staging.myappsonline.net/login
        run: |
          set -eu
          for i in $(seq 1 5); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$URL" || true)"
            echo "attempt $i: HTTP $code"
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "::error::staging did not answer 200 after the deploy"
          exit 1

      # Reset the server to the commit it was on and re-run deploy.sh there, so the
      # composer install / migrations / caches match the code that is back in place.
      # `reset --hard` leaves untracked files (server-only .env backups) alone.
      - name: Roll back
        if: failure() && env.PREV_SHA != ''
        env:
          SSH: ssh -i ~/.ssh/deploy_key -p ${{ secrets.AMANAHKU_STAGING_PORT }} ${{ secrets.AMANAHKU_STAGING_USER }}@${{ secrets.AMANAHKU_STAGING_HOST }}
          DEPLOY_PATH: ${{ secrets.AMANAHKU_STAGING_PATH }}
        run: |
          set -eu
          echo "::warning::deploy failed, rolling staging back to $PREV_SHA"
          $SSH "
            set -eu
            cd '$DEPLOY_PATH'
            git reset --hard $PREV_SHA
            bash deploy.sh
          "
          code="$(curl -s -o /dev/null -w '%{http_code}' -m 20 https://amanahku-staging.myappsonline.net/login || true)"
          echo "staging after rollback: HTTP $code"
          [ "$code" = 200 ] || echo "::error::staging is still not answering 200 after the rollback — needs a human"

      # A rolled-back fix must not stay merged into staging, or the next deploy
      # ships it again. Revert the merge commit on the branch.
      - name: Revert the merge on staging
        if: failure() && env.PREV_SHA != '' && needs.merge.outputs.merge_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.merge.outputs.merge_sha }}
        run: |
          set -eu
          git clone "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" repo
          cd repo
          git config user.name "supportos-bot"
          git config user.email "supportos-bot@users.noreply.github.com"
          git checkout staging
          git revert --no-edit "$MERGE_SHA"
          git push origin staging
          echo "::warning::reverted the auto-fix commit on staging"
