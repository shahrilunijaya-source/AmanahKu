# Canonical URSB GitLab issue labels (source of truth: gitlab-workflow.md).
# Apply with scripts/setup-labels.sh. Keep in sync with delivery/gitlab-labels.md.
labels:
  - name: "gsd-clarification"
    color: "#1f75cb"
    description: "Issue awaiting GSD clarification answers"
  - name: "decision-required"
    color: "#ec5e00"
    description: "A human decision/approval is required"
  - name: "business-decision"
    color: "#6699cc"
    description: "Decision owned by PM / Product Owner"
  - name: "technical-decision"
    color: "#6699cc"
    description: "Decision owned by Conventional Coder / Tech Lead"
  - name: "security-decision"
    color: "#cc0000"
    description: "Decision owned by Security / Compliance"
  - name: "client-input-required"
    color: "#fc9403"
    description: "Blocked pending client/stakeholder input"
  - name: "changes-requested"
    color: "#d9534f"
    description: "Returned for changes; loops back to proposal"
  - name: "pm-approved"
    color: "#5cb85c"
    description: "Scope/proposal approved by PM / Product Owner"
  - name: "technical-approved"
    color: "#5cb85c"
    description: "Technical plan approved (Conventional Coder/Tech Lead)"
  - name: "qa-approved"
    color: "#5cb85c"
    description: "QA evidence signed off by QA / Test Owner"
  - name: "ready-for-release"
    color: "#17a2b8"
    description: "All gates passed; ready for the release owner"
  - name: "confirmed"
    color: "#2e7d32"
    description: "Released and confirmed in production"
